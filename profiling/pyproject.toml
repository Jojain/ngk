# Installed as a uv tool so the repo has a `profile` command:
#
#     uv tool install --editable ./profiling
#
# Editable, so editing these files changes the command with no reinstall. The
# package depends only on Typer for its command interface. It locates the repo's
# .venv and drives samply, py-spy and maturin as subprocesses. It is deliberately
# not part of the `ngk` distribution -- profiling tooling has no business shipping
# inside the library wheel.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ngk-profile"
version = "0.0.1"
description = "Records a profile of a Python script or Rust example using ngk"
requires-python = ">=3.9"
dependencies = ["typer>=0.15,<1"]

[project.scripts]
profile = "ngk_profile.profile:main"

[tool.hatch.build.targets.wheel]
packages = ["ngk_profile"]
