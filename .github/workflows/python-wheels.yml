name: Build Python distributions

on:
  pull_request:
    paths:
      - Cargo.lock
      - Cargo.toml
      - pyproject.toml
      - bindings/python/**
      - .github/workflows/python-wheels.yml
  push:
    branches:
      - master
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheel:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86_64
            runner: windows-2022
            manylinux: "off"
          - name: macOS x86_64
            runner: macos-15-intel
            manylinux: "off"
          - name: macOS arm64
            runner: macos-14
            manylinux: "off"
          - name: Linux x86_64
            runner: ubuntu-24.04
            manylinux: "2014"
          - name: Linux arm64
            runner: ubuntu-24.04-arm
            manylinux: "2014"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          rust-toolchain: stable
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --compatibility pypi --out dist
      - name: Verify installed wheel
        run: |
          python -m pip install --no-deps dist/*.whl
          python -c "import ngk; from ngk.modeling import booleans, solids; assert not hasattr(ngk, 'block'); shape = booleans.fuse(solids.block(10, 10, 10), solids.block(5, 5, 5)); assert shape.__class__.__name__ == 'Solid'"
      - uses: actions/upload-artifact@v4
        with:
          name: ngk-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: Source distribution
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build source distribution
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          rust-toolchain: stable
          args: --out dist
      - name: Verify source distribution metadata and install
        run: |
          python -m pip install twine
          python -m twine check --strict dist/*
          python -m pip install --no-deps dist/*.tar.gz
          python -c "import ngk; from ngk.modeling import booleans, solids; assert not hasattr(ngk, 'block'); assert booleans.fuse(solids.block(10, 10, 10), solids.block(5, 5, 5)).__class__.__name__ == 'Solid'"
      - uses: actions/upload-artifact@v4
        with:
          name: ngk-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish distributions to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - wheel
      - sdist
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/ngk
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
