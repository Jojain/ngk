name: Deploy NGK Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: brep-bench/kernels/ngk
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: brep-bench/reference-requirements.txt
      - name: Install OCP reference dependencies
        run: python -m pip install -r brep-bench/reference-requirements.txt
      - name: Generate benchmark results and reference models
        run: python brep-bench/viewer.py --refresh
      - name: Upload benchmark data
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-data
          path: brep-bench/viewer-data/
          if-no-files-found: error
          retention-days: 1

  build:
    runs-on: ubuntu-latest
    needs: benchmark

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build visualization
        env:
          VITE_BASE_PATH: /ngk/
        run: npm run build --workspace visualization

      - name: Build sandbox
        env:
          VITE_BASE_PATH: /ngk/sandbox/
        run: npm run build --workspace sandbox

      - name: Download benchmark data
        uses: actions/download-artifact@v4
        with:
          name: benchmark-data
          path: brep-bench/viewer-data

      - name: Build benchmark gallery
        env:
          VITE_BASE_PATH: /ngk/benchmark/
        run: npm run benchmark:build --workspace visualization

      - name: Assemble Pages site
        run: |
          mkdir -p pages/sandbox pages/benchmark
          cp -R visualization/dist/. pages/
          cp -R sandbox/dist/. pages/sandbox/
          cp -R visualization/benchmark-dist/. pages/benchmark/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
