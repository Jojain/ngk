name: brep-bench gate

on:
  pull_request:
    paths:
      - src/**
      - Cargo.toml
      - Cargo.lock
      - brep-bench/**
      - .github/workflows/brep-bench.yml
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            brep-bench/kernels/ngk/target
          key: brep-bench-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'brep-bench/kernels/ngk/Cargo.lock') }}
      - name: Run brep-bench and compare with the baseline
        run: python3 brep-bench/gate.py
