[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "ngk"
authors = [{name = "Romain Ferru", email = "romain.ferru@gmail.com"}]
version = "0.0.1"
description = "Python bindings for the NGK geometry kernel"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "build123d>=0.8.0",
]

[tool.maturin]
features = ["python"]
module-name = "ngk._ngk"
python-source = "bindings/python/python"
