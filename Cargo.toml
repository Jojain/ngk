[package]
name = "ngk"
version = "0.0.1"
edition = "2024"
license = "MIT"
description = "Nales Geometry Kernel, a GMap-based CAD geometry kernel"
repository = "https://github.com/Jojain/ngk"
homepage = "https://jojain.github.io/ngk/"
keywords = ["cad", "geometry", "gmap", "nurbs"]
categories = ["science", "mathematics"]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "ngk"
path = "src/main.rs"

[features]
default = []
python = ["dep:pyo3"]
wasm = ["dep:wasm-bindgen", "dep:js-sys", "dep:serde-wasm-bindgen", "dep:console_error_panic_hook"]

[dependencies]
nalgebra = { version = "0.34.2", features = ["serde-serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pyo3 = { version = "0.22.6", optional = true, features = ["extension-module", "abi3", "abi3-py312", "generate-import-lib"] }
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
slotmap = { version = "1.1.1", features = ["serde"] }
radians = "0.3.1"
thiserror = "2.0.18"
winnow = "1.0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Optimised like release, but emits the PDB that lets samply name the frames.
# Thin LTO instead of fat so function boundaries survive into the call tree;
# flip to `lto = true` when measuring the exact code that ships. `profile.ps1`
# records against this profile.
[profile.profiling]
inherits = "release"
debug = true
lto = "thin"

[profile.dev]
opt-level = 0
debug = 2

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
slotmap = "1.1.1"

[[bench]]
name = "booleans"
harness = false
